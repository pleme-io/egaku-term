[package]
name = "egaku-term"
version = "0.3.9"
edition = "2024"
rust-version = "1.89.0"
description = "Egaku-Term — terminal renderer + runtime for egaku widget state machines (crossterm-backed, sync + tokio)"
homepage = "https://github.com/pleme-io/egaku-term"
repository = "https://github.com/pleme-io/egaku-term"
documentation = "https://docs.rs/egaku-term"
readme = "README.md"
license = "MIT"
categories = ["command-line-interface", "gui"]
keywords = ["tui", "terminal", "widgets", "egaku", "crossterm"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[features]
default = []
# Pull in tokio + crossterm event-stream for `app::run_async`.
tokio = ["dep:tokio", "dep:futures-util", "crossterm/event-stream"]

[dependencies]
# A plain version requirement, and it must STAY one: crates.io refuses a git
# dependency in a released crate. This read `{ git = ..., version = "0.1" }`
# from this repo's first commit, which made egaku-term structurally
# unreleasable — the `ship` job failed every time with "structurally
# UNPUBLISHABLE … git-dependency".
#
# That failure was invisible because an earlier job in the same workflow
# (`bump`) died first on a rebase conflict, so `ship` never ran. Fixing the
# rebase (pleme-io/actions 6907a60) is what finally let the release get far
# enough to reveal this. banken already names egaku by version; this matches.
egaku = "0.1"
# The typed key vocabulary this crate DELIVERS INTO. egaku itself must not
# depend on awase (its load-bearing property is no renderer, no backend);
# egaku-term is the adapter, and an adapter is exactly the layer that may
# know both sides. awase's deps are a strict subset of egaku's, so this
# edge adds no transitive crate.
awase = "0.1"
crossterm = "0.28"
thiserror = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
tokio = { version = "1", features = ["macros", "rt"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }

# `AsyncApp` only exists under the `tokio` feature, so its tests only compile
# there. Run them with `cargo test --features tokio` (or `--all-features`).
[[test]]
name = "wake_arm"
required-features = ["tokio"]
